<rect x="336.0" y="460" width="28" height="16" fill="white" opacity="0.85"/>
<text x="350.0" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">yes</text>
<line x1="190.0" y1="226" x2="190.0" y2="260" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="176.0" y="235.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="190.0" y="247.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">no</text>
<line x1="190.0" y1="316" x2="190.0" y2="350" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="176.0" y="325.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="190.0" y="337.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">no</text>
<line x1="190.0" y1="406" x2="190.0" y2="440" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="176.0" y="415.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="190.0" y="427.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">no</text>
<path d="M190.0,496 L190.0,558 L360,558" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="176.0" y="519.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="190.0" y="531.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">no</text>
<g class="node" id="decision-neon"><title>Compile-time gate ONNX_LIGHT_CPU_HAVE_NEON. When absent (e.g. a portable non-SIMD target), the scalar kernel is the only implementation.</title><rect x="620" y="170" width="280" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="760.0" y="194.0" text-anchor="middle" font-size="13" fill="#1a1a1a">ARM NEON compiled in?</text><text x="760.0" y="210.0" text-anchor="middle" font-size="13" fill="#1a1a1a">(ONNX_LIGHT_CPU_HAVE_NEON)</text></g>
<g class="node" id="decision-sve"><title>Compile-time gate ONNX_LIGHT_CPU_HAVE_SVE AND DetectArmGemmProfile().kind == kSve. Scalable Vector Extension: length-agnostic vectors selected ahead of fixed-width NEON.</title><rect x="620" y="300" width="280" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="760.0" y="324.0" text-anchor="middle" font-size="13" fill="#1a1a1a">SVE compiled in AND runtime</text><text x="760.0" y="340.0" text-anchor="middle" font-size="13" fill="#1a1a1a">profile == kSve?</text></g>
<g class="node" id="decision-neon-rt"><title>Runtime ARM profile reports NEON (Advanced SIMD): 128-bit fixed-width vectors, the baseline vector kernel on AArch64.</title><rect x="620" y="430" width="280" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="760.0" y="454.0" text-anchor="middle" font-size="13" fill="#1a1a1a">DetectArmGemmProfile()</text><text x="760.0" y="470.0" text-anchor="middle" font-size="13" fill="#1a1a1a">kind == kNeon?</text></g>
<g class="node" id="leaf-arm-scalar"><title>GemmKernelKind::kScalar -- portable C++ fallback used when no ARM vector kernel is compiled in.</title><rect x="930" y="170" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="1005.0" y="203.0" text-anchor="middle" font-size="13" fill="#1a1a1a">Scalar</text></g>
<g class="node" id="leaf-sve"><title>GemmKernelKind::kSve -- scalable-vector ARM kernel (gemm_kernel_arm.cc).</title><rect x="930" y="300" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="1005.0" y="333.0" text-anchor="middle" font-size="13" fill="#1a1a1a">SVE</text></g>
<g class="node" id="leaf-neon"><title>GemmKernelKind::kNeon -- 128-bit Advanced SIMD ARM kernel.</title><rect x="930" y="430" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="1005.0" y="463.0" text-anchor="middle" font-size="13" fill="#1a1a1a">NEON</text></g>
<g class="node" id="leaf-arm-scalar2"><title>GemmKernelKind::kScalar -- reached when neither SVE nor NEON is available at runtime.</title><rect x="930" y="550" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="1005.0" y="583.0" text-anchor="middle" font-size="13" fill="#1a1a1a">Scalar</text></g>
