<svg viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="gemm-kernel-tree-title">
<title id="gemm-kernel-tree-title">SelectGemmKernelKind decision tree</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#666666"/></marker></defs>
<text x="560.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">SelectGemmKernelKind&lt;T&gt;() decision tree (hover a box for details)</text>
<text x="560.0" y="48" text-anchor="middle" font-size="12" font-style="italic" fill="#666666">selected once per (element type, process), then reused for every Gemm call; compile-time gate AND runtime CPUID gate both apply</text>
<g class="node" id="decision-root"><title>The very first split: on a non-x86 target no x86 vector intrinsics are compiled, so SelectGemmKernelKind picks from the ARM (NEON/SVE) kernels or the portable scalar kernel; on an x86 build it reads DetectSimdLevel() once and walks the AVX-512 &gt; AVX2+FMA &gt; AVX &gt; SSE2 ladder.</title><rect x="430" y="66" width="260" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="560.0" y="90.0" text-anchor="middle" font-size="13" fill="#1a1a1a">Non-x86 build?</text><text x="560.0" y="106.0" text-anchor="middle" font-size="13" fill="#1a1a1a">(ONNX_LIGHT_CPU_X86 == 0)</text></g>
<g class="node" id="decision-avx512"><title>Compile-time gate ONNX_LIGHT_CPU_HAVE_AVX512 (toolchain accepted -mavx512f, so gemm_kernel_avx512.cc is in the binary) AND runtime gate DetectSimdLevel() &gt;= kAVX512. 512-bit vectors, NR=2: 32 float / 16 double lanes per step.</title><rect x="40" y="170" width="300" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="190.0" y="194.0" text-anchor="middle" font-size="13" fill="#1a1a1a">AVX-512 compiled in AND</text><text x="190.0" y="210.0" text-anchor="middle" font-size="13" fill="#1a1a1a">DetectSimdLevel() &gt;= kAVX512?</text></g>
<g class="node" id="decision-avx2fma"><title>Compile-time gate ONNX_LIGHT_CPU_HAVE_AVX2_FMA AND runtime DetectSimdLevel() &gt;= kAVX2 AND CpuSupportsFma(). The fused-multiply-add AVX2 micro-kernel: 256-bit vectors with a single rounding per multiply-add, faster and more accurate than plain AVX.</title><rect x="40" y="260" width="300" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="190.0" y="284.0" text-anchor="middle" font-size="13" fill="#1a1a1a">AVX2+FMA compiled in AND level</text><text x="190.0" y="300.0" text-anchor="middle" font-size="13" fill="#1a1a1a">&gt;= kAVX2 AND CpuSupportsFma()?</text></g>
<g class="node" id="decision-avx"><title>Plain AVX (no FMA) is always compiled in at the baseline ONNX_LIGHT_CPU_SIMD_FLAGS (default -mavx2), so only the runtime CPUID probe gates it: 256-bit vectors, NR=2, 16 float / 8 double lanes per step.</title><rect x="40" y="350" width="300" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="190.0" y="374.0" text-anchor="middle" font-size="13" fill="#1a1a1a">DetectSimdLevel()</text><text x="190.0" y="390.0" text-anchor="middle" font-size="13" fill="#1a1a1a">&gt;= kAVX?</text></g>
<g class="node" id="decision-sse2"><title>SSE2 is guaranteed on every x86-64 CPU, so this is the safe baseline: 128-bit vectors, NR=2, 8 float / 4 double lanes per step.</title><rect x="40" y="440" width="300" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="190.0" y="464.0" text-anchor="middle" font-size="13" fill="#1a1a1a">DetectSimdLevel()</text><text x="190.0" y="480.0" text-anchor="middle" font-size="13" fill="#1a1a1a">&gt;= kSSE2?</text></g>
<g class="node" id="leaf-avx512"><title>GemmKernelKind::kAVX512 -- separate translation unit compiled only with -mavx512f.</title><rect x="360" y="170" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="435.0" y="203.0" text-anchor="middle" font-size="13" fill="#1a1a1a">AVX-512</text></g>
<g class="node" id="leaf-avx2fma"><title>GemmKernelKind::kAVX2FMA -- fused multiply-add AVX2 kernel (gemm_kernel_avx2_fma.cc).</title><rect x="360" y="260" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="435.0" y="293.0" text-anchor="middle" font-size="13" fill="#1a1a1a">AVX2+FMA</text></g>
<g class="node" id="leaf-avx"><title>GemmKernelKind::kAVX -- 256-bit AVX path without FMA, present in every x86 build.</title><rect x="360" y="350" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="435.0" y="383.0" text-anchor="middle" font-size="13" fill="#1a1a1a">AVX</text></g>
<g class="node" id="leaf-sse2"><title>GemmKernelKind::kSSE2 -- 128-bit baseline path guaranteed on x86-64.</title><rect x="360" y="440" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="435.0" y="473.0" text-anchor="middle" font-size="13" fill="#1a1a1a">SSE2</text></g>
<g class="node" id="leaf-x86-scalar"><title>GemmKernelKind::kScalar -- reached only if runtime detection reports below SSE2, which does not happen on real x86-64 hardware; also the per-tile tail handler.</title><rect x="360" y="530" width="150" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="435.0" y="563.0" text-anchor="middle" font-size="13" fill="#1a1a1a">Scalar</text></g>
