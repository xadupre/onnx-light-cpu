<path d="M165.0,1266 L165.0,1358.0 L350,1358.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="153.0" y="1292.0" width="24.0" height="16" fill="white" opacity="0.85"/><text x="165.0" y="1304.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">no</text>
<text x="30" y="1426" font-size="13" fill="#1a1a1a">Scalar = portable C++ kernel that multiplies one element at a time (no SIMD). It is the correctness fallback and</text>
<text x="30" y="1446" font-size="13" fill="#1a1a1a">    also runs the sub-vector tail of every vector kernel.</text>
<text x="30" y="1466" font-size="13" fill="#333333">Packing: this tree only chooses the micro-kernel. Every kind first goes through the same cache-blocking and</text>
<text x="30" y="1486" font-size="13" fill="#333333">    A/B packing (PackAPanel / PackBPanel); only the innermost multiply differs between kinds.</text>
<text x="30" y="1506" font-size="13" fill="#333333">Split-K, Direct and the skinny paths are NOT selected here: the algorithm is chosen separately by shape --</text>
<text x="30" y="1526" font-size="13" fill="#333333">    see the SelectGemmAlgorithm “strategy zones” figure below.</text>
<text x="30" y="1560" font-size="12" fill="#666666">Legend: blue = compile-time / runtime gate, green = selected GemmKernelKind (amber = SIMD width / relative gain).</text>
</svg>
