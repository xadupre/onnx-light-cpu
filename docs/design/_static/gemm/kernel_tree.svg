<svg viewBox="0 0 720 1600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="gemm-kernel-tree-title">
<title id="gemm-kernel-tree-title">SelectGemmKernelKind decision tree</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#666666"/></marker></defs>
<text x="360.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">SelectGemmKernelKind&lt;T&gt;() decision tree</text>
<text x="360.0" y="52" text-anchor="middle" font-size="13" font-style="italic" fill="#666666">Picks the SIMD micro-kernel once per (element type, process); hover a box for details.</text>
<g class="node" id="decision-root"><title>The very first split: on a non-x86 target no x86 vector intrinsics are compiled, so SelectGemmKernelKind picks from the ARM (NEON/SVE) kernels or the portable scalar kernel; on an x86 build it reads DetectSimdLevel() once and walks the AVX-512 &gt; AVX2+FMA &gt; AVX &gt; SSE2 ladder.</title><rect x="235.0" y="72" width="250" height="66" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="360.0" y="101.0" text-anchor="middle" font-size="15" fill="#1a1a1a">Non-x86 build?</text><text x="360.0" y="119.0" text-anchor="middle" font-size="15" fill="#1a1a1a">(ONNX_LIGHT_CPU_X86 == 0)</text></g>
<g class="node" id="decision-avx512"><title>Compile-time gate ONNX_LIGHT_CPU_HAVE_AVX512 (toolchain accepted -mavx512f, so gemm_kernel_avx512.cc is in the binary) AND runtime gate DetectSimdLevel() &gt;= kAVX512. 512-bit vectors, NR=2: 32 float / 16 double lanes per step.</title><rect x="40" y="200" width="250" height="66" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="165.0" y="229.0" text-anchor="middle" font-size="15" fill="#1a1a1a">AVX-512 compiled in AND</text><text x="165.0" y="247.0" text-anchor="middle" font-size="15" fill="#1a1a1a">DetectSimdLevel() &gt;= kAVX512?</text></g>
<g class="node" id="decision-avx2fma"><title>Compile-time gate ONNX_LIGHT_CPU_HAVE_AVX2_FMA AND runtime DetectSimdLevel() &gt;= kAVX2 AND CpuSupportsFma(). The fused-multiply-add AVX2 micro-kernel: 256-bit vectors with a single rounding per multiply-add, faster and more accurate than plain AVX.</title><rect x="40" y="340" width="250" height="66" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="165.0" y="369.0" text-anchor="middle" font-size="15" fill="#1a1a1a">AVX2+FMA compiled in AND level</text><text x="165.0" y="387.0" text-anchor="middle" font-size="15" fill="#1a1a1a">&gt;= kAVX2 AND CpuSupportsFma()?</text></g>
<g class="node" id="decision-avx"><title>Plain AVX (no FMA) is always compiled in at the baseline ONNX_LIGHT_CPU_SIMD_FLAGS (default -mavx2), so only the runtime CPUID probe gates it: 256-bit vectors, NR=2, 16 float / 8 double lanes per step.</title><rect x="40" y="480" width="250" height="66" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="165.0" y="509.0" text-anchor="middle" font-size="15" fill="#1a1a1a">DetectSimdLevel()</text><text x="165.0" y="527.0" text-anchor="middle" font-size="15" fill="#1a1a1a">&gt;= kAVX?</text></g>
<g class="node" id="decision-sse2"><title>SSE2 is guaranteed on every x86-64 CPU, so this is the safe baseline: 128-bit vectors, NR=2, 8 float / 4 double lanes per step.</title><rect x="40" y="620" width="250" height="66" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="165.0" y="649.0" text-anchor="middle" font-size="15" fill="#1a1a1a">DetectSimdLevel()</text><text x="165.0" y="667.0" text-anchor="middle" font-size="15" fill="#1a1a1a">&gt;= kSSE2?</text></g>
<g class="node" id="leaf-avx512"><title>GemmKernelKind::kAVX512 -- separate translation unit compiled only with -mavx512f. Widest vectors, highest throughput on Intel server CPUs.</title><rect x="350" y="200" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="224.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">AVX-512</text><text x="450.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">32 f32 / 16 f64 lanes · ~2x AVX2</text></g>
<g class="node" id="leaf-avx2fma"><title>GemmKernelKind::kAVX2FMA -- fused multiply-add AVX2 kernel (gemm_kernel_avx2_fma.cc). ~2x an SSE2 baseline; fused MAC also rounds once.</title><rect x="350" y="340" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="364.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">AVX2+FMA</text><text x="450.0" y="383.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">16 f32 lanes · fused MAC, best accuracy</text></g>
<g class="node" id="leaf-avx"><title>GemmKernelKind::kAVX -- 256-bit AVX path without FMA, present in every x86 build. Same width as AVX2+FMA but two rounding steps per multiply-add.</title><rect x="350" y="480" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="504.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">AVX</text><text x="450.0" y="523.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">16 f32 lanes · no FMA</text></g>
<g class="node" id="leaf-sse2"><title>GemmKernelKind::kSSE2 -- 128-bit baseline path guaranteed on x86-64.</title><rect x="350" y="620" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="644.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">SSE2</text><text x="450.0" y="663.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">8 f32 lanes · baseline</text></g>
<g class="node" id="leaf-x86-scalar"><title>GemmKernelKind::kScalar -- reached only if runtime detection reports below SSE2, which does not happen on real x86-64 hardware; also the per-tile tail handler for the vector kernels.</title><rect x="350" y="740" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="764.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Scalar</text><text x="450.0" y="783.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">1 element at a time · fallback + tail</text></g>
<path d="M360.0,138 L360.0,160 L165.0,160 L165.0,200" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="229.5" y="142" width="66.0" height="16" fill="white" opacity="0.85"/><text x="262.5" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">no / x86</text>
<line x1="290" y1="233.0" x2="350" y2="233.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="304.5" y="215.0" width="31.0" height="16" fill="white" opacity="0.85"/><text x="320.0" y="227.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">yes</text>
<line x1="290" y1="373.0" x2="350" y2="373.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="304.5" y="355.0" width="31.0" height="16" fill="white" opacity="0.85"/><text x="320.0" y="367.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">yes</text>
<line x1="290" y1="513.0" x2="350" y2="513.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="304.5" y="495.0" width="31.0" height="16" fill="white" opacity="0.85"/><text x="320.0" y="507.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">yes</text>
<line x1="290" y1="653.0" x2="350" y2="653.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="304.5" y="635.0" width="31.0" height="16" fill="white" opacity="0.85"/><text x="320.0" y="647.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">yes</text>
<line x1="165.0" y1="266" x2="165.0" y2="340" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="153.0" y="295.0" width="24.0" height="16" fill="white" opacity="0.85"/><text x="165.0" y="307.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">no</text>
<line x1="165.0" y1="406" x2="165.0" y2="480" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="153.0" y="435.0" width="24.0" height="16" fill="white" opacity="0.85"/><text x="165.0" y="447.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">no</text>
<line x1="165.0" y1="546" x2="165.0" y2="620" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="153.0" y="575.0" width="24.0" height="16" fill="white" opacity="0.85"/><text x="165.0" y="587.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">no</text>
<path d="M165.0,686 L165.0,768.0 L350,768.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="153.0" y="707.0" width="24.0" height="16" fill="white" opacity="0.85"/><text x="165.0" y="719.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666">no</text>
<line x1="28" y1="866" x2="700" y2="866" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
<text x="40" y="858" font-size="13" font-weight="bold" fill="#666666">ARM / portable subtree (non-x86 build)</text>
<g class="node" id="decision-neon"><title>Compile-time gate ONNX_LIGHT_CPU_HAVE_NEON. When absent (e.g. a portable non-SIMD target), the scalar kernel is the only implementation.</title><rect x="40" y="900" width="250" height="66" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="165.0" y="929.0" text-anchor="middle" font-size="15" fill="#1a1a1a">ARM NEON compiled in?</text><text x="165.0" y="947.0" text-anchor="middle" font-size="15" fill="#1a1a1a">(ONNX_LIGHT_CPU_HAVE_NEON)</text></g>
<g class="node" id="decision-sve"><title>Compile-time gate ONNX_LIGHT_CPU_HAVE_SVE AND DetectArmGemmProfile().kind == kSve. Scalable Vector Extension: length-agnostic vectors selected ahead of fixed-width NEON.</title><rect x="40" y="1050" width="250" height="66" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="165.0" y="1079.0" text-anchor="middle" font-size="15" fill="#1a1a1a">SVE compiled in AND runtime</text><text x="165.0" y="1097.0" text-anchor="middle" font-size="15" fill="#1a1a1a">profile == kSve?</text></g>
<g class="node" id="decision-neon-rt"><title>Runtime ARM profile reports NEON (Advanced SIMD): 128-bit fixed-width vectors, the baseline vector kernel on AArch64.</title><rect x="40" y="1200" width="250" height="66" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/><text x="165.0" y="1229.0" text-anchor="middle" font-size="15" fill="#1a1a1a">DetectArmGemmProfile()</text><text x="165.0" y="1247.0" text-anchor="middle" font-size="15" fill="#1a1a1a">kind == kNeon?</text></g>
<g class="node" id="leaf-arm-scalar"><title>GemmKernelKind::kScalar -- portable C++ fallback used when no ARM vector kernel is compiled in.</title><rect x="350" y="900" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="924.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Scalar</text><text x="450.0" y="943.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">1 element at a time · portable</text></g>
<g class="node" id="leaf-sve"><title>GemmKernelKind::kSve -- scalable-vector ARM kernel (gemm_kernel_arm.cc).</title><rect x="350" y="1050" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="1074.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">SVE</text><text x="450.0" y="1093.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">length-agnostic vectors</text></g>
<g class="node" id="leaf-neon"><title>GemmKernelKind::kNeon -- 128-bit Advanced SIMD ARM kernel.</title><rect x="350" y="1200" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="1224.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">NEON</text><text x="450.0" y="1243.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">4 f32 lanes (128-bit)</text></g>
<g class="node" id="leaf-arm-scalar2"><title>GemmKernelKind::kScalar -- reached when neither SVE nor NEON is available at runtime.</title><rect x="350" y="1330" width="200" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/><text x="450.0" y="1354.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Scalar</text><text x="450.0" y="1373.0" text-anchor="middle" font-size="11.5" fill="#8a6d1f">1 element at a time · fallback</text></g>
<path d="M360.0,138 L360.0,160 L650,160 L650,933.0 L290,933.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
