<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="gemm-kernel-tree-title">
<title id="gemm-kernel-tree-title">SelectGemmKernelKind decision tree</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="900" height="620" fill="white"/>
<text x="450.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">SelectGemmKernelKind&lt;T&gt;() decision tree (hover a box for details)</text>
<text x="430.0" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#666666">selected once per (element type, process), then reused for every Gemm call</text>
<g class="node" id="decision-0">
<title>Portable target with no x86 vector intrinsics compiled in: the scalar kernel is the only implementation, so it is selected unconditionally.</title>
<rect x="300" y="60" width="260" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/>
<text x="430.0" y="85.0" text-anchor="middle" font-size="13" fill="#1a1a1a">Non-x86 build?</text>
<text x="430.0" y="101.0" text-anchor="middle" font-size="13" fill="#1a1a1a">(ONNX_LIGHT_CPU_X86 == 0)</text>
</g>
<g class="node" id="decision-1">
<title>Compile-time gate: gemm_kernel_avx512.cc only exists in the binary when the toolchain accepted -mavx512f (ONNX_LIGHT_CPU_HAVE_AVX512). Runtime gate: DetectSimdLevel() is a one-time CPUID probe cached for the process. Both must hold for the 512-bit, NR=2 kernel (32 float / 16 double lanes per step) to run.</title>
<rect x="300" y="180" width="260" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/>
<text x="430.0" y="205.0" text-anchor="middle" font-size="13" fill="#1a1a1a">AVX-512 compiled in AND</text>
<text x="430.0" y="221.0" text-anchor="middle" font-size="13" fill="#1a1a1a">DetectSimdLevel() &gt;= kAVX512?</text>
</g>
<g class="node" id="decision-2">
<title>AVX2 is always compiled in at the baseline ONNX_LIGHT_CPU_SIMD_FLAGS (default -mavx2), so only the runtime CPUID probe gates this branch: 256-bit vectors, NR=2, 16 float / 8 double lanes per step.</title>
<rect x="300" y="300" width="260" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/>
<text x="430.0" y="325.0" text-anchor="middle" font-size="13" fill="#1a1a1a">DetectSimdLevel()</text>
<text x="430.0" y="341.0" text-anchor="middle" font-size="13" fill="#1a1a1a">&gt;= kAVX?</text>
</g>
<g class="node" id="decision-3">
<title>SSE2 is guaranteed on every x86-64 CPU, so this is the safe baseline: 128-bit vectors, NR=2, 8 float / 4 double lanes per step.</title>
<rect x="300" y="420" width="260" height="56" rx="8" ry="8" fill="#eaf1fb" stroke="#4472c4" stroke-width="1.5"/>
<text x="430.0" y="445.0" text-anchor="middle" font-size="13" fill="#1a1a1a">DetectSimdLevel()</text>
<text x="430.0" y="461.0" text-anchor="middle" font-size="13" fill="#1a1a1a">&gt;= kSSE2?</text>
</g>
<g class="node" id="leaf-0">
<title>GemmKernelKind::kScalar -- portable C++ fallback; also used as the tail handler on x86.</title>
<rect x="620" y="60" width="170" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/>
<text x="705.0" y="93.0" text-anchor="middle" font-size="13" fill="#1a1a1a">Scalar</text>
</g>
<g class="node" id="leaf-1">
<title>GemmKernelKind::kAVX512 -- separate translation unit compiled only with -mavx512f.</title>
<rect x="620" y="180" width="170" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/>
<text x="705.0" y="213.0" text-anchor="middle" font-size="13" fill="#1a1a1a">AVX-512</text>
</g>
<g class="node" id="leaf-2">
<title>GemmKernelKind::kAVX -- 256-bit AVX2 path, present in every build.</title>
<rect x="620" y="300" width="170" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/>
<text x="705.0" y="333.0" text-anchor="middle" font-size="13" fill="#1a1a1a">AVX</text>
</g>
<g class="node" id="leaf-3">
<title>GemmKernelKind::kSSE2 -- 128-bit baseline path guaranteed on x86-64.</title>
<rect x="620" y="420" width="170" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/>
<text x="705.0" y="453.0" text-anchor="middle" font-size="13" fill="#1a1a1a">SSE2</text>
</g>
<g class="node" id="leaf-4">
<title>GemmKernelKind::kScalar -- reached only if runtime detection reports below SSE2, which does not happen on real x86-64 hardware.</title>
<rect x="620" y="540" width="170" height="56" rx="8" ry="8" fill="#e5f3e0" stroke="#548235" stroke-width="1.5"/>
<text x="705.0" y="573.0" text-anchor="middle" font-size="13" fill="#1a1a1a">Scalar</text>
</g>
<line x1="300" y1="88.0" x2="620" y2="88.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="446.0" y="78.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="460.0" y="90.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">yes</text>
<line x1="430.0" y1="116" x2="430.0" y2="180" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="416.0" y="138.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="430.0" y="150.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">no</text>
<line x1="560" y1="208.0" x2="620" y2="208.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="576.0" y="198.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="590.0" y="210.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">yes</text>
<line x1="430.0" y1="236" x2="430.0" y2="300" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="416.0" y="258.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="430.0" y="270.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">no</text>
<line x1="560" y1="328.0" x2="620" y2="328.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="576.0" y="318.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="590.0" y="330.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">yes</text>
<line x1="430.0" y1="356" x2="430.0" y2="420" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="416.0" y="378.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="430.0" y="390.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">no</text>
<line x1="560" y1="448.0" x2="620" y2="448.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="576.0" y="438.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="590.0" y="450.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">yes</text>
<line x1="430.0" y1="476" x2="390.0" y2="540" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="396.0" y="498.0" width="28" height="16" fill="white" opacity="0.85"/>
<text x="410.0" y="510.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">no</text>
<text x="20" y="604" font-size="11" fill="#666666">Legend: blue = compile-time/runtime gate, green = selected GemmKernelKind.</text>
</svg>