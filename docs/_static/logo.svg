<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 80" width="116" height="80">
  <!-- Background rounded rect -->
  <rect width="116" height="80" rx="10" ry="10" fill="#1a1a2e"/>

  <!-- CPU package pins -->
  <g fill="#4a9eff">
    <rect x="40" y="16" width="4" height="6" rx="1"/>
    <rect x="50" y="16" width="4" height="6" rx="1"/>
    <rect x="60" y="16" width="4" height="6" rx="1"/>
    <rect x="70" y="16" width="4" height="6" rx="1"/>
    <rect x="40" y="58" width="4" height="6" rx="1"/>
    <rect x="50" y="58" width="4" height="6" rx="1"/>
    <rect x="60" y="58" width="4" height="6" rx="1"/>
    <rect x="70" y="58" width="4" height="6" rx="1"/>
    <rect x="22" y="34" width="6" height="4" rx="1"/>
    <rect x="22" y="44" width="6" height="4" rx="1"/>
    <rect x="86" y="34" width="6" height="4" rx="1"/>
    <rect x="86" y="44" width="6" height="4" rx="1"/>
  </g>

  <!-- CPU package -->
  <rect x="30" y="22" width="54" height="38" rx="5" ry="5" fill="#9b7ec8"/>
  <rect x="35" y="27" width="44" height="28" rx="3" ry="3" fill="#f2edf7"/>

  <!-- Die core with parallel SIMD lanes -->
