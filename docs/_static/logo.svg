  <g fill="#f5a623">
    <rect x="45" y="36" width="24" height="2.4" rx="1"/>
    <rect x="45" y="40" width="24" height="2.4" rx="1"/>
    <rect x="45" y="44" width="24" height="2.4" rx="1"/>
  </g>
</svg>
