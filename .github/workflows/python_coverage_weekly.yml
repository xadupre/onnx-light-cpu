name: python-coverage-weekly

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 05:00 UTC.
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set parallel build level
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"

      - name: Build and install onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: |
          pip install "cmake>=4" nanobind scikit-build-core setuptools numpy pytest pytest-cov matplotlib ml_dtypes onnxruntime openpyxl pandas tqdm
          onnx_light_source="${RUNNER_TEMP}/onnx-light"
          git clone --depth 1 --branch main https://github.com/xadupre/onnx-light.git "${onnx_light_source}"
          pip install -C build.verbose=true -C wheel.py-api=cp312 "${onnx_light_source}" -v
          onnx_light_libdir=$(python -c "from onnx_light import get_cpp_build_info as info; print(info()['library_dir'])")
          echo "LD_LIBRARY_PATH=${onnx_light_libdir}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build extension
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: python setup.py build_ext --inplace --onnx-light-source

      - name: Run Python tests with coverage
        run: python -m pytest --durations=10 --cov=onnx_light_cpu --cov-report=xml --cov-report=term-missing unittests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: python-${{ runner.os }}
          name: python-${{ runner.os }}-py3.13
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
