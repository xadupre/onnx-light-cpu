name: docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-core-night-doc:
    name: ci-core-night-doc
    runs-on: ubuntu-latest
    # The package is compiled from source, so the job needs more time than a
    # plain Sphinx build; sccache keeps repeat runs near-instant.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Build and install onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: |
          # Build the current main branch once and install that exact wheel.
          # onnx-light-cpu subsequently discovers the loaded runtime through
          # get_cpp_build_info(), avoiding a second CMake-installed copy with a
          # different dispatch registry.
          pip install nanobind scikit-build-core numpy
          git clone --depth 1 --branch main https://github.com/xadupre/onnx-light.git /tmp/onnx-light
          pip install -C build.verbose=true /tmp/onnx-light -v
          onnx_light_libdir=$(python -c "from onnx_light import get_cpp_build_info as info; print(info()['library_dir'])")
          echo "LD_LIBRARY_PATH=${onnx_light_libdir}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install documentation dependencies
        run: |
          pip install \
            breathe matplotlib myst-parser onnxruntime pydata-sphinx-theme \
            "sphinx>=7" sphinx-copybutton sphinx-datatables sphinx-gallery \
            sphinx-reredirects

      # Link to the exact onnx-light runtime installed above. Installing the
      # ``dev`` extra here would replace it with the released Linux-only wheel.
      - name: Build package
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: python setup.py build_ext --inplace --onnx-light-source

      # sphinx-build exits non-zero when Sphinx-Gallery fails to execute an
      # example, so this step fails if the documentation stops running.
      # ``-W`` treats warnings (e.g. a broken cross-reference introduced by a
      # stale or duplicated generated kernel page) as errors, so the
      # generated kernel inventory documentation can never silently drift
      # out of parity with the runtime registrations it is built from.
      - name: Build documentation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: sphinx-build -W -b html docs dist/html
