name: cpp-coverage-weekly

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 05:00 UTC.
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_recent_commit:
    name: check recent commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Trigger is ${{ github.event_name }}; running unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On scheduled runs, only proceed when a commit was made on the
          # default branch within the last week.
          recent=$(git log -1 --since='7 days ago' --format=%H || true)
          if [ -n "$recent" ]; then
            echo "Recent commit found: $recent"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit in the last week; skipping coverage build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  cpp-coverage:
    name: C++ coverage (ubuntu-latest)
    needs: check_recent_commit
    if: needs.check_recent_commit.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install gcovr
        run: |
          python -m pip install --upgrade pip
          python -m pip install gcovr

      - name: Configure with coverage
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DONNX_LIGHT_CPU_BUILD_TESTS=ON \
            -DONNX_LIGHT_CPU_BUILD_PYTHON=OFF \
            -DONNX_LIGHT_CPU_INSTALL=OFF \
            -DONNX_LIGHT_CPU_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure --timeout 240

      - name: Generate coverage report
        run: |
          gcovr --root . \
            --filter 'onnx_light_cpu/' \
            --gcov-ignore-parse-errors \
            --xml-pretty --output coverage.xml \
            --print-summary

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: cpp
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
