name: cpp-coverage-weekly

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 05:00 UTC.
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_recent_commit:
    name: check recent commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Trigger is ${{ github.event_name }}; running unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On scheduled runs, only proceed when a commit was made on the
          # default branch within the last week.
          recent=$(git log -1 --since='7 days ago' --format=%H || true)
          if [ -n "$recent" ]; then
            echo "Recent commit found: $recent"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit in the last week; skipping coverage build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  cpp-coverage:
    name: C++ coverage (${{ matrix.processor }})
    needs: check_recent_commit
    if: needs.check_recent_commit.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Native runners alone miss fallback dispatch and instruction sets not
        # exposed by their hosts. Emulate those CPUs without forcing unsafe ISA
        # flags on baseline code. All reports are merged under the cpp flag.
        include:
          - processor: x86-native
            os: ubuntu-latest
            launcher: ""
          - processor: arm64-native
            os: ubuntu-24.04-arm
            launcher: ""
          - processor: sse2
            os: ubuntu-latest
            launcher: "qemu-x86_64;-cpu;Opteron_G1"
          - processor: avx
            os: ubuntu-latest
            launcher: "qemu-x86_64;-cpu;SandyBridge"
          - processor: avx2
            os: ubuntu-latest
            launcher: "qemu-x86_64;-cpu;Haswell"
          - processor: avx512
            os: ubuntu-latest
            launcher: "sde64;-spr;--"
          - processor: sve
            os: ubuntu-24.04-arm
            launcher: "qemu-aarch64;-cpu;max,sve=on,sve-max-vq=4"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install gcovr
        run: |
          python -m pip install --upgrade pip
          python -m pip install gcovr

      - name: Install QEMU
        if: startsWith(matrix.launcher, 'qemu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Install Intel SDE
        if: matrix.processor == 'avx512'
        run: |
          # QEMU on Ubuntu 24.04 cannot emulate AVX-512. Sapphire Rapids in
          # SDE also exposes the BF16, FP16, VNNI, and AMX extensions.
          curl --fail --location --retry 3 \
            https://downloadmirror.intel.com/915934/sde-external-10.8.0-2026-03-15-lin.tar.xz \
            --output "${RUNNER_TEMP}/sde.tar.xz"
          echo "50b320cd226acef7a491f5b321fc1be3c3c7984f9e27a456e64894b5b0979dd3  ${RUNNER_TEMP}/sde.tar.xz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/sde"
          tar -xf "${RUNNER_TEMP}/sde.tar.xz" -C "${RUNNER_TEMP}/sde" --strip-components=1
          echo "${RUNNER_TEMP}/sde" >> "$GITHUB_PATH"

      - name: Configure with coverage
        env:
          # Requires CMake >= 3.29 (provided by the Ubuntu runners). This also
          # launches GoogleTest discovery under the selected processor.
          CMAKE_TEST_LAUNCHER: ${{ matrix.launcher }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DONNX_LIGHT_CPU_BUILD_TESTS=ON \
            -DONNX_LIGHT_CPU_BUILD_PYTHON=OFF \
            -DONNX_LIGHT_CPU_INSTALL=OFF \
            -DONNX_LIGHT_CPU_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure --timeout 600 --parallel $(nproc)

      - name: Generate coverage report
        run: |
          mkdir -p coverage-html
          # Restrict gcovr's search to the build tree so the ``.gcno``/``.gcda``
          # data is always discovered regardless of the working directory.
          gcovr --root . build \
            --filter 'onnx_light_cpu/' \
            --filter 'ml_cpu_compute/src/' \
            --filter 'ml_cpu_compute/include/' \
            --gcov-ignore-parse-errors \
            --xml-pretty --output coverage.xml \
            --html-details coverage-html/index.html \
            --print-summary

      - name: Fail on empty coverage report
        shell: bash
        run: |
          # gcovr succeeds but emits an empty report when no coverage data is
          # found; guard against silently uploading a meaningless report.
          valid=$(grep -o 'lines-valid="[0-9]*"' coverage.xml | head -1 | grep -o '[0-9]*')
          echo "Measured lines: ${valid:-0}"
          if [ -z "${valid}" ] || [ "${valid}" -eq 0 ]; then
            echo "::error::Coverage report contains no measured lines."
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage-${{ matrix.processor }}
          path: |
            coverage.xml
            coverage-html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: cpp
          name: cpp-${{ matrix.processor }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
