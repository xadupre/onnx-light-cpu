name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          pip install \
            black==26.5.1 \
            clang-format==22.1.8 \
            mypy==2.3.1 \
            pyrefly==1.2.0 \
            ruff==0.16.4

      - name: Install build dependencies (nanobind)
        run: pip install nanobind scikit-build-core
