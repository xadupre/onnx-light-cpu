name: ci-core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Set up MSVC for Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Build and install package (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_CPU_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Build and install package (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Ninja
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_CPU_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure -C Release --timeout 240

      - name: Run Python tests
        run: pytest --durations=10 --cov=onnx_light_cpu --cov-report=xml --cov-report=term-missing unittests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python-${{ runner.os }}
          name: python-${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  setup_onnx_light_source:
    name: setup.py --cpp-tests --onnx-light-source
    runs-on: ubuntu-latest
    # onnx-light is compiled from source before onnx-light-cpu, so this job
    # needs more time than a plain build; sccache keeps repeat runs fast.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Build and install onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # onnx-light's CMake calls find_package(nanobind) via "python -m
          # nanobind --cmake_dir", so nanobind (and scikit-build-core) must be
          # importable before configuring it. Recent onnx-light sources also
          # query numpy.get_include() at configure time, so numpy is required too.
          pip install nanobind scikit-build-core numpy
          git clone --depth 1 --branch 0.1.17 https://github.com/xadupre/onnx-light.git /tmp/onnx-light
          cmake -S /tmp/onnx-light -B /tmp/onnx-light/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/onnx-light/install -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build /tmp/onnx-light/build --config Release --parallel --verbose
          cmake --install /tmp/onnx-light/build --config Release
          pip install -C build.verbose=true /tmp/onnx-light -v
          # --onnx-light-source links the exact shared libraries loaded by the
          # importable onnx-light, so those libraries must be on LD_LIBRARY_PATH
          # for the C++ tests (run by ctest below) to start.
          onnx_light_libdir=$(dirname "$(find /tmp/onnx-light/install -name 'liblib_onnx_proto.so' | head -1)")
          if [ ! -d "${onnx_light_libdir}" ]; then
            echo "Could not locate liblib_onnx_proto.so under /tmp/onnx-light/install" >&2
            exit 1
          fi
          echo "LD_LIBRARY_PATH=${onnx_light_libdir}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build extension and run C++ tests via setup.py
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: python setup.py build_ext --inplace --cpp-tests --onnx-light-source

  arm_gemm_native:
    name: ARM64 GEMM (NEON)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DONNX_LIGHT_CPU_BUILD_TESTS=ON -DONNX_LIGHT_CPU_BUILD_PYTHON=OFF -DONNX_LIGHT_CPU_INSTALL=OFF

      - name: Build GEMM tests
        run: cmake --build build --parallel --target test_gemm_kernel test_gemm_plan

      - name: Run GEMM tests
        run: ctest --test-dir build --output-on-failure -R "Gemm|MatMul" --timeout 240

  arm_gemm_sve:
    name: ARM64 GEMM (SVE emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install cross compiler and emulator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user

      - name: Configure
        run: |
          cmake -S . -B build-sve \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DONNX_LIGHT_CPU_BUILD_TESTS=ON \
            -DONNX_LIGHT_CPU_BUILD_PYTHON=OFF \
            -DONNX_LIGHT_CPU_INSTALL=OFF

      - name: Build GEMM tests
        run: cmake --build build-sve --parallel --target test_gemm_kernel test_gemm_plan

      - name: Run GEMM tests with 512-bit SVE
        run: |
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=4 -L /usr/aarch64-linux-gnu build-sve/test_gemm_kernel --gtest_brief=1
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=4 -L /usr/aarch64-linux-gnu build-sve/test_gemm_plan --gtest_brief=1

      - name: Run 128-bit SVE fallback
        run: |
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=1 -L /usr/aarch64-linux-gnu build-sve/test_gemm_kernel --gtest_brief=1
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=1 -L /usr/aarch64-linux-gnu build-sve/test_gemm_plan --gtest_brief=1

      - name: Run non-power-of-two 384-bit SVE
        run: |
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=3 -L /usr/aarch64-linux-gnu build-sve/test_gemm_kernel --gtest_brief=1
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=3 -L /usr/aarch64-linux-gnu build-sve/test_gemm_plan --gtest_brief=1
