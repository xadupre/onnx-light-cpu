name: ci-core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Set up MSVC for Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # onnx-light ships prebuilt wheels for linux/x86_64/py3.13 only (see the
      # ``dev`` extra in pyproject.toml), so Linux is the only matrix entry where
      # the onnx-light integration can be built. Build the extension against the
      # installed onnx-light runtime and run the full test suite so this job runs
      # the same C++ and Python tests as the docs and onnx-light-source jobs
      # (issue #240). macOS and Windows have no onnx-light wheel, so they build
      # the CPU-only kernels and skip the onnx-light integration tests below.
      - name: Build and install package (Linux)
        if: runner.os == 'Linux'
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DONNX_LIGHT_CPU_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: |
          # .[dev] installs onnx-light and the test tools; nanobind and
          # scikit-build-core are build-time requirements of the setup.py
          # invocation below (it drives CMake directly, without pip's build
          # isolation).
          pip install .[dev] nanobind scikit-build-core -v
          # get_cpp_build_info() reports the directory of the shared libraries
          # loaded by onnx-light's Python runtime; they must be on
          # LD_LIBRARY_PATH for the C++ tests (which link them) to start.
          onnx_light_libdir=$(python -c "from onnx_light import get_cpp_build_info as info; print(info()['library_dir'])")
          echo "LD_LIBRARY_PATH=${onnx_light_libdir}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          # Link the integration to the exact runtime loaded by onnx-light so the
          # accelerated kernels register into the same global dispatch table.
          python setup.py build_ext --inplace --onnx-light-source

      - name: Build and install package (macOS)
        if: runner.os == 'macOS'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_CPU_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Build and install package (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Ninja
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_CPU_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: pip freeze
        run: pip freeze

      # The Linux build above compiles the tests (onnx-light integration
      # included) into build/temp via setup.py; the other platforms use the pip
      # build-dir (build).
      - name: Run C++ unit tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build/temp --output-on-failure -C Release --timeout 240

      - name: Run C++ unit tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure -C Release --timeout 240

      # On Linux onnx-light is available, so run the full suite (including the
      # onnx-light-driven test_kernels_e2e.py). PYTHONPATH points pytest at the
      # in-place build from setup.py above. The other platforms have no
      # onnx-light and must skip the integration tests.
      - name: Run Python tests (Linux)
        if: runner.os == 'Linux'
        run: PYTHONPATH="$PWD" pytest --durations=10 --cov=onnx_light_cpu --cov-report=xml --cov-report=term-missing unittests

      - name: Run Python tests
        if: runner.os != 'Linux'
        run: pytest --durations=10 --cov=onnx_light_cpu --cov-report=xml --cov-report=term-missing unittests --ignore=unittests/python/test_kernels_e2e.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python-${{ runner.os }}
          name: python-${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  setup_onnx_light_source:
    name: onnx-light main (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # onnx-light is compiled from source before onnx-light-cpu, so this job
    # needs more time than a plain build; sccache keeps repeat runs fast.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Set up MSVC for Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Select Ninja generator (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Build and install onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        shell: bash
        run: |
          pip install nanobind scikit-build-core numpy pytest
          onnx_light_source="${RUNNER_TEMP}/onnx-light"
          git clone --depth 1 --branch main https://github.com/xadupre/onnx-light.git "${onnx_light_source}"
          pip install -C build.verbose=true "${onnx_light_source}" -v
          python - <<'PY'
          import os
          from onnx_light import get_cpp_build_info

          variable = {
              "Linux": "LD_LIBRARY_PATH",
              "macOS": "DYLD_LIBRARY_PATH",
              "Windows": "PATH",
          }[os.environ["RUNNER_OS"]]
          library_dir = get_cpp_build_info()["library_dir"]
          current = os.environ.get(variable, "")
          value = library_dir if not current else library_dir + os.pathsep + current
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"{variable}={value}\n")
          PY

      - name: Build extension and run C++ tests via setup.py
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: python setup.py build_ext --inplace --cpp-tests --onnx-light-source

      - name: Run onnx-light integration tests
        run: python -m pytest unittests

  arm_gemm_native:
    name: ARM64 GEMM (NEON)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DONNX_LIGHT_CPU_BUILD_TESTS=ON -DONNX_LIGHT_CPU_BUILD_PYTHON=OFF -DONNX_LIGHT_CPU_INSTALL=OFF

      - name: Build GEMM tests
        run: cmake --build build --parallel --target test_gemm_kernel test_gemm_plan test_integer_gemm_vnni

      - name: Run GEMM tests
        run: ctest --test-dir build --output-on-failure -R "Gemm|MatMul|Integer" --timeout 240

  arm_gemm_sve:
    name: ARM64 GEMM (SVE emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install cross compiler and emulator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user

      - name: Configure
        run: |
          cmake -S . -B build-sve \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DONNX_LIGHT_CPU_BUILD_TESTS=ON \
            -DONNX_LIGHT_CPU_BUILD_PYTHON=OFF \
            -DONNX_LIGHT_CPU_INSTALL=OFF

      - name: Build GEMM tests
        run: cmake --build build-sve --parallel --target test_gemm_kernel test_gemm_plan test_integer_gemm_vnni

      - name: Run GEMM tests with 512-bit SVE
        run: |
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=4 -L /usr/aarch64-linux-gnu build-sve/test_gemm_kernel --gtest_brief=1
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=4 -L /usr/aarch64-linux-gnu build-sve/test_gemm_plan --gtest_brief=1
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=4 -L /usr/aarch64-linux-gnu build-sve/test_integer_gemm_vnni --gtest_brief=1

      - name: Run 128-bit SVE fallback
        run: |
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=1 -L /usr/aarch64-linux-gnu build-sve/test_gemm_kernel --gtest_brief=1
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=1 -L /usr/aarch64-linux-gnu build-sve/test_gemm_plan --gtest_brief=1

      - name: Run non-power-of-two 384-bit SVE
        run: |
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=3 -L /usr/aarch64-linux-gnu build-sve/test_gemm_kernel --gtest_brief=1
          qemu-aarch64 -cpu max,sve=on,sve-max-vq=3 -L /usr/aarch64-linux-gnu build-sve/test_gemm_plan --gtest_brief=1
