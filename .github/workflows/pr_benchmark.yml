name: PR benchmark

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
    paths:
      - "onnx_light_cpu/backend_test/cases/**"
      - "onnx_light_cpu/impl/**"
      - "onnx_light_cpu/kernels/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install build dependencies
        run: |
          pip install \
            nanobind \
            numpy \
            openpyxl \
            scikit-build-core \
            "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.24/onnx_light-0.1.24-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          git clone --depth 1 --branch main \
            https://github.com/xadupre/onnx-light.git \
            "${RUNNER_TEMP}/onnx-light"

      - name: Build package
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          ONNX_LIGHT_CPU_ONNX_LIGHT_SOURCE_DIR: ${{ runner.temp }}/onnx-light
        run: python setup.py build_ext --inplace --onnx-light-source

      - name: Benchmark modified operator and data type
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m onnx_light_cpu benchmark \
            --from-pr "${{ github.event.pull_request.html_url }}" \
            --markdown benchmark.md \
            --output "${{ runner.temp }}/benchmark.xlsx"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: pr-benchmark
          path: benchmark.md

  report:
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download benchmark report
        uses: actions/download-artifact@v4
        with:
          name: pr-benchmark

      - name: Update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" \
            --edit-last \
            --create-if-none \
            --body-file benchmark.md
