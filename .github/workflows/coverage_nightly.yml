name: coverage-nightly

on:
  workflow_dispatch:
  schedule:
    # Every night at 05:00 UTC.
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: C++ and Python coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
      ONNX_LIGHT_CPU_ONNX_LIGHT_SOURCE_DIR: ${{ github.workspace }}/.deps/onnx-light
    strategy:
      fail-fast: false
      matrix:
        # Measuring coverage on a single architecture only exercises the
        # kernels compiled for that machine (e.g. AVX2/AVX512 on x86_64),
        # leaving architecture-specific code such as the ARM NEON kernels
        # unmeasured and dragging down the reported coverage. Run the job on
        # both x86_64 and arm64 runners so both code paths are covered.
        os: ["ubuntu-latest", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@v7

      - name: Check out onnx-light
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: "0.2.0"
          path: .deps/onnx-light
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind scikit-build-core setuptools numpy \
            pytest pytest-cov matplotlib ml_dtypes onnxruntime openpyxl pandas tqdm gcovr

      - name: Build and install onnx-light
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          python -m pip install -C wheel.py-api=cp312 ./.deps/onnx-light -v
          library_dir=$(python -c 'from onnx_light import get_cpp_build_info; print(get_cpp_build_info()["library_dir"])')
          echo "LD_LIBRARY_PATH=${library_dir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Build with coverage and run C++ unit tests
        env:
          CMAKE_ARGS: -DCMAKE_BUILD_TYPE=Debug -DONNX_LIGHT_CPU_ENABLE_COVERAGE=ON
        run: python setup.py build_ext --inplace --cpp-tests --onnx-light-source

      - name: Run Python tests with coverage
        run: |
          python -m pytest --durations=10 --cov=onnx_light_cpu \
            --cov-report=xml:python-coverage.xml \
            --cov-report=html:python-coverage-html \
            --cov-report=term-missing unittests

      - name: Generate coverage report
        run: |
          mkdir -p coverage-html
          # Restrict gcovr's search to the build tree so the ``.gcno``/``.gcda``
          # data is always discovered regardless of the working directory.
          gcovr --root . build \
            --filter 'onnx_light_cpu/' \
            --gcov-ignore-parse-errors \
            --xml-pretty --output coverage.xml \
            --html-details coverage-html/index.html \
            --print-summary

      - name: Fail on empty coverage report
        shell: bash
        run: |
          # gcovr succeeds but emits an empty report when no coverage data is
          # found; guard against silently uploading a meaningless report.
          valid=$(grep -o 'lines-valid="[0-9]*"' coverage.xml | head -1 | grep -o '[0-9]*')
          echo "Measured lines: ${valid:-0}"
          if [ -z "${valid}" ] || [ "${valid}" -eq 0 ]; then
            echo "::error::Coverage report contains no measured lines."
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage-${{ matrix.os }}
          path: |
            coverage.xml
            coverage-html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: cpp
          name: cpp-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ matrix.os }}
          path: |
            python-coverage.xml
            python-coverage-html

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: python-coverage.xml
          flags: python-${{ runner.os }}
          name: python-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
