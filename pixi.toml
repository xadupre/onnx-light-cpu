[workspace]
name = "onnx-light-cpu"
description = "Highly optimized CPU kernels for onnx-light"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = ">=2.1"
cmake = ">=3.27"
ninja = "*"
cxx-compiler = "*"
scikit-build-core = ">=0.3.3"
nanobind = ">=1.3.2"
pip = "*"

[feature.dev.dependencies]
pytest = ">=7"
pytest-cov = "*"

[feature.dev.pypi-dependencies]
black = "==26.5.1"
clang-format = "==22.1.8"
mypy = "==2.3.0"
pyrefly = "==1.2.0"
ruff = "==0.16.3"

[feature.docs.dependencies]
pydata-sphinx-theme = "*"
sphinx = ">=7"
sphinx-copybutton = "*"
sphinx-datatables = "*"
sphinx-gallery = "*"
sphinx-reredirects = "*"
myst-parser = "*"
matplotlib = "*"

[tasks]
install = "pip install --no-build-isolation -e .[dev]"
test = { cmd = "pytest --durations=10 unittests", depends-on = ["install"] }
test-python = { cmd = "pytest --durations=10 unittests/python", depends-on = ["install"] }
lint = "ruff check . && ruff format --check . && black --check ."
build-doc = { cmd = "sphinx-build -b html docs dist/html", depends-on = ["install"] }

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
