[build-system]
requires = ["scikit-build-core>=0.3.3", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "onnx-light-cpu"
version = "0.1.16"
description = "Highly optimized CPU kernels (Abs) for onnx-light with AVX/AVX2/AVX-512 dispatch"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
onnx-light-cpu = "onnx_light_cpu.__main__:main"

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "clang-format==22.1.8",
    "matplotlib",
    "ml_dtypes",
    "mypy==2.3.1",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.24/onnx_light-0.1.24-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.24/onnx_light-0.1.24-cp313-cp313-macosx_13_0_universal2.whl ; sys_platform == 'darwin' and python_version == '3.13'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.24/onnx_light-0.1.24-cp313-cp313-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
    "onnxruntime",
    "openpyxl",
    "pandas",
    "pyrefly==1.2.0",
    "pytest>=7",
    "pytest-cov",
    "ruff==0.16.4",
    "tqdm",
]
docs = [
    "breathe",
    "matplotlib",
    "ml_dtypes",
    "myst-parser",
    "openpyxl",
    "pandas",
    "tqdm",
    # "onnx-light",
    "onnxruntime",
    "pydata-sphinx-theme",
    "sphinx>=7",
    "sphinx-copybutton",
    "sphinx-datatables",
    "sphinx-design",
    "sphinx-gallery",
    "sphinx-reredirects",
]

[tool.scikit-build]
wheel.packages = ["onnx_light_cpu"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["unittests"]

[tool.mypy]
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["onnx_light_cpu/**/*.py"]

[tool.black]
extend-exclude = "/(build|dist|docs/auto_[^/]+)/"
line-length = 98
target-version = ["py312"]

[tool.ruff]
exclude = [".eggs", ".git", "build", "dist"]
line-length = 98

[tool.ruff.lint]
select = [
    "B", "C4", "E", "F", "G", "ISC", "LOG", "PIE", "PYI", "RUF",
    "SIM", "SLOT", "T10", "UP", "W", "YTT",
]

[tool.ruff.lint.extend-per-file-ignores]
"**" = ["RUF012", "RUF100", "SIM102", "SIM108", "UP006", "UP007", "UP035"]
"unittests/**" = ["B023", "B904", "E731"]
"docs/examples/**" = ["E402"]
